name: Repair Home Reference

on:
  push:
    branches:
      - feature/home-exact-reference-v1
    paths:
      - 'repair-home-q80/**'
      - '.github/workflows/repair-home-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify approved reference
        shell: bash
        run: |
          set -euo pipefail
          cat repair-home-q80/chunks/*.txt | tr -d '\r\n' | base64 --decode > assets/world/v7/home-approved.webp
          test "$(wc -c < assets/world/v7/home-approved.webp)" -eq 179986
          test "$(git hash-object assets/world/v7/home-approved.webp)" = "45f201f512c96faaba75abf26ceeba3d3372b614"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          data = Path('assets/world/v7/home-approved.webp').read_bytes()
          assert data[:4] == b'RIFF'
          assert data[8:12] == b'WEBP'
          assert struct.unpack('<I', data[4:8])[0] + 8 == len(data)
          print('PASS repaired approved Home reference')
          PY
      - name: Commit repaired binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/world/v7/home-approved.webp
          if git diff --cached --quiet; then
            echo "Reference already repaired"
            exit 0
          fi
          git commit -m "fix(home): restore valid approved reference asset"
          git push origin HEAD:feature/home-exact-reference-v1
