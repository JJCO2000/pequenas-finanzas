# one-shot preview publication trigger
name: Publish Preview Once

on:
  push:
    branches:
      - feature/racha-financiera-v1
    paths:
      - .github/workflows/publish-preview-once.yml

concurrency:
  group: publish-preview-once
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo install --check
      - run: npx expo-doctor@latest
      - run: npm run audit:source:hygiene
      - run: npm run audit:streak:v1
      - run: npm run audit:plan7-rn086
      - run: npm run audit:plan7-imports
      - run: npm run audit:plan7-strict
      - run: npm run audit:games:layout-v2
      - run: npm run audit:navigation:v1
      - run: npm run audit:control-states:v1
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is not configured."
            exit 1
          fi
      - name: Publish OTA to preview
        run: |
          npx eas-cli@latest update --channel preview --environment preview --message "Preview: navigation audit, egg shop improvements, basket cleanup and control-state guards" --non-interactive
