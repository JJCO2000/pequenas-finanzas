name: Patch Memory Absolute Fill

on:
  push:
    branches:
      - feature/offline-gamefeel-v2

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-memory-absfill]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-gamefeel-v2
      - name: Patch unsupported StyleSheet property
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/games/money-memory/Game.tsx')
          s = p.read_text()
          old = "flipFace: { ...StyleSheet.absoluteFillObject, borderRadius: 15,"
          new = "flipFace: { position: 'absolute', left: 0, right: 0, top: 0, bottom: 0, borderRadius: 15,"
          if old not in s:
              raise SystemExit('target pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/patch-memory-absfill.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/games/money-memory/Game.tsx .github/workflows/patch-memory-absfill.yml
          git commit -m "fix(rn086): use explicit absolute fill for memory cards"
          git push origin HEAD:feature/offline-gamefeel-v2
