name: Home Visual Verify

on:
  push:
    branches:
      - feature/home-exact-reference-v1
    paths:
      - 'src/app/start.tsx'
      - 'src/features/home/**'
      - 'src/core/data/repositories/profileRepository.ts'
      - 'src/core/data/repositories/adventureRepository.ts'
      - 'src/core/data/repositories/investmentRepository.ts'
      - 'src/core/data/repositories/streakRepository.ts'
      - 'src/core/data/repositories/repositorySupport.ts'
      - 'assets/world/v7/home-background.webp'
      - 'metro.config.js'
      - 'scripts/check-home-responsive.mjs'
      - 'scripts/check-krug-home-camp-v1.mjs'
      - 'scripts/check-plan7-strict.mjs'
      - 'scripts/audit-navigation-buttons-v1.mjs'
      - 'scripts/navigation-button-baseline.json'
      - 'scripts/home-visual.e2e.spec.mjs'
      - 'scripts/verify-home-visual-evidence.py'
      - 'scripts/serve-home-visual.py'
      - '.github/workflows/home-visual-verify.yml'
  workflow_dispatch:

concurrency:
  group: home-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit:home:responsive
      - run: node scripts/check-plan7-strict.mjs --home-contract-only
      - run: node scripts/audit-navigation-buttons-v1.mjs --home-contract-only
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m pip install --disable-pip-version-check pillow
      - run: npx expo export --platform web --output-dir dist --clear
      - name: Start isolated visual web server
        run: |
          python3 scripts/serve-home-visual.py > /tmp/home-visual-server.log 2>&1 &
          echo $! > /tmp/home-visual-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/home-visual-server.log
          exit 1
      - run: npx playwright test scripts/home-visual.e2e.spec.mjs --reporter=line --workers=1
      - run: python3 scripts/verify-home-visual-evidence.py
      - name: Upload responsive Home evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-responsive-evidence
          path: artifacts/home-*.png
          if-no-files-found: ignore
