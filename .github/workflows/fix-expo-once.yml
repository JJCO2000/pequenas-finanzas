name: Fix Expo Patch Once

on:
  push:
    branches:
      - feature/home-exact-reference-v1
    paths:
      - .github/EXPO_PATCH_ONCE

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - name: Install current lock
        run: npm ci
      - name: Align Expo patch
        run: npx expo install "expo@~57.0.23"
      - name: Verify Expo dependency alignment
        run: npx expo install --check
      - name: Typecheck
        run: npm run typecheck
      - name: Commit generated lockfile patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "fix(deps): align Expo 57.0.23"
          git push origin HEAD:${{ github.ref_name }}
