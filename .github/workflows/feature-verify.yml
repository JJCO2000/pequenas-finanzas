name: Feature Verify

on:
  push:
    branches:
      - feature/racha-financiera-v1
      - fix/game-layout-audit-v2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo install --check
      - run: npx expo-doctor@latest
      - run: npm run audit:source:hygiene
      - run: npm run audit:streak:v1
      - run: npm run audit:plan7-rn086
      - run: npm run audit:plan7-imports
      - run: npm run audit:plan7-strict
      - run: npm run audit:games:layout-v2
      - run: npm audit --omit=dev --audit-level=high
