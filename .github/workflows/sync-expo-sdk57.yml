name: One-shot Expo SDK 57 dependency sync

on:
  push:
    branches:
      - ci/no-auto-eas-policy
    paths:
      - .github/workflows/sync-expo-sdk57.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo install --fix
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm run check:ci-policy
      - name: Commit dependency alignment and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-expo-sdk57.yml
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: align Expo SDK 57 patch dependencies"
          git push origin HEAD:${{ github.ref_name }}
