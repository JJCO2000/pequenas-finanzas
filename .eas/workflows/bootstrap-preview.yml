name: Pequeñas Finanzas Preview Update

on:
  push:
    branches:
      - feature/racha-financiera-v1

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  verify_install:
    name: Verify install
    environment: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules

  verify_typecheck:
    name: Verify typecheck
    environment: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run typecheck

  verify_expo_dependencies:
    name: Verify Expo dependencies
    environment: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npx expo install --check

  publish_preview_update:
    name: Publish Android Preview Update
    needs: [verify_install, verify_typecheck, verify_expo_dependencies]
    type: update
    environment: preview
    params:
      channel: preview
      platform: android
      message: "Pequeñas Finanzas — Racha Financiera v1 + visual polish"
