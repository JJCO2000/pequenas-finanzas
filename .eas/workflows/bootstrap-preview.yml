name: Pequeñas Finanzas Preview Update

on:
  push:
    branches:
      - chore/eas-preview-updates

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  verify:
    name: Verify Android preview update
    environment: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run typecheck
      - run: npx expo install --check

  publish_preview_update:
    name: Publish Android Preview Update
    needs: [verify]
    type: update
    environment: preview
    params:
      channel: preview
      platform: android
      message: "Pequeñas Finanzas preview update"
