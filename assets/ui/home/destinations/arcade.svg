<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Arcade 7 retos">
  <defs>
    <linearGradient id="sky" x1="160" y1="0" x2="160" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9E8FF"/>
      <stop offset="1" stop-color="#EAF8FF"/>
    </linearGradient>
    <linearGradient id="body" x1="123" y1="52" x2="118" y2="169" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7B59"/>
      <stop offset="1" stop-color="#F34C3B"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF1B5"/>
      <stop offset="1" stop-color="#FFD773"/>
    </linearGradient>
    <linearGradient id="cabinet" x1="205" y1="68" x2="232" y2="162" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A5DE3"/>
      <stop offset="1" stop-color="#4F39B6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#123E56" flood-opacity=".20"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="24" fill="url(#sky)"/>

  <!-- soft jungle/game backdrop -->
  <path d="M0 133C37 112 72 117 103 111C139 104 171 89 202 99C236 109 264 126 320 117V200H0Z" fill="#9BDE84"/>
  <path d="M0 152C43 136 83 144 119 133C156 122 187 118 219 126C255 135 281 151 320 145V200H0Z" fill="#57B663"/>
  <g fill="#238A50">
    <circle cx="27" cy="151" r="19"/><circle cx="50" cy="157" r="15"/><circle cx="291" cy="147" r="18"/><circle cx="270" cy="157" r="16"/>
  </g>

  <!-- arcade cabinet -->
  <g filter="url(#shadow)">
    <path d="M190 56H270C278 56 284 62 284 70V169H188V69C188 62 193 56 200 56Z" fill="url(#cabinet)" stroke="#3F2A98" stroke-width="5"/>
    <rect x="201" y="70" width="69" height="48" rx="9" fill="#2C215F"/>
    <rect x="207" y="76" width="57" height="36" rx="6" fill="#6FD0FF"/>
    <path d="M216 105L229 90L238 98L248 84L258 105Z" fill="#4B9D63"/>
    <circle cx="224" cy="87" r="6" fill="#FFD85A"/>
    <rect x="201" y="126" width="68" height="31" rx="9" fill="#5D47C8"/>
    <circle cx="219" cy="141" r="7" fill="#FF5B66" stroke="#F6D7DE" stroke-width="2"/>
    <circle cx="245" cy="136" r="5" fill="#FFD85A"/>
    <circle cx="257" cy="146" r="5" fill="#61D68D"/>
    <path d="M220 127V116" stroke="#2E2759" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- red baby dinosaur -->
  <g filter="url(#shadow)">
    <!-- tail -->
    <path d="M103 145C83 160 62 163 45 156C35 152 31 144 35 138C40 132 49 134 59 138C75 144 88 138 99 125Z" fill="url(#body)"/>
    <!-- body -->
    <ellipse cx="120" cy="134" rx="43" ry="39" fill="url(#body)"/>
    <ellipse cx="127" cy="139" rx="24" ry="30" fill="url(#belly)"/>
    <!-- neck -->
    <path d="M111 126C103 109 104 91 111 75C118 60 130 52 144 53C158 55 167 67 166 83C165 101 155 117 147 130Z" fill="url(#body)"/>
    <path d="M129 121C123 108 124 95 128 84C132 75 138 69 145 69C152 70 157 77 156 87C154 101 147 113 143 124Z" fill="url(#belly)"/>
    <!-- head -->
    <path d="M127 60C140 44 163 39 184 43C205 47 219 63 218 79C216 95 199 105 176 105C157 105 139 99 129 89C119 79 119 69 127 60Z" fill="url(#body)"/>
    <ellipse cx="177" cy="81" rx="29" ry="19" fill="#FF8462"/>
    <!-- eye -->
    <ellipse cx="162" cy="63" rx="17" ry="19" fill="#FFFFFF"/>
    <ellipse cx="167" cy="66" rx="10" ry="12" fill="#0A2530"/>
    <ellipse cx="170" cy="61" rx="3.5" ry="4" fill="#FFFFFF"/>
    <!-- mouth -->
    <path d="M173 89C185 94 198 93 209 89C205 99 195 103 184 102C177 101 173 97 173 89Z" fill="#8D2025"/>
    <path d="M180 98C187 96 196 97 202 100C196 104 189 104 184 102Z" fill="#F25E72"/>
    <!-- nostrils -->
    <ellipse cx="203" cy="72" rx="2.8" ry="3.4" fill="#8B2A22"/>
    <ellipse cx="213" cy="74" rx="2.5" ry="3.1" fill="#8B2A22"/>
    <!-- arms -->
    <path d="M102 111C92 113 88 123 93 130C97 135 104 133 109 128L115 122Z" fill="#F34C3B"/>
    <path d="M148 112C157 113 163 119 162 126C161 133 153 136 146 132L139 126Z" fill="#F34C3B"/>
    <!-- legs -->
    <path d="M95 154C87 158 84 167 87 177H112C116 167 112 158 104 155Z" fill="#E84538"/>
    <path d="M132 156C124 160 122 168 125 178H151C155 168 151 159 143 156Z" fill="#E84538"/>
    <!-- claws -->
    <path d="M90 174L94 168L98 175Z" fill="#FFF0C3"/><path d="M100 175L104 168L108 175Z" fill="#FFF0C3"/>
    <path d="M130 175L134 168L138 175Z" fill="#FFF0C3"/><path d="M141 175L145 168L149 175Z" fill="#FFF0C3"/>
    <!-- spots -->
    <g fill="#D92E50">
      <ellipse cx="135" cy="54" rx="7" ry="5"/><ellipse cx="123" cy="72" rx="6" ry="5"/><ellipse cx="119" cy="91" rx="5" ry="4"/>
      <ellipse cx="108" cy="118" rx="7" ry="5"/><ellipse cx="99" cy="136" rx="6" ry="5"/>
    </g>
  </g>

  <!-- foreground arcade coin -->
  <g filter="url(#shadow)">
    <circle cx="176" cy="139" r="24" fill="#F4B932" stroke="#D69419" stroke-width="4"/>
    <circle cx="176" cy="139" r="17" fill="#FFD95A"/>
    <path d="M176 127L179.5 134.2L187.5 135.3L181.7 140.9L183.1 148.8L176 145.1L168.9 148.8L170.3 140.9L164.5 135.3L172.5 134.2Z" fill="#FFF2A3" stroke="#E8A91F" stroke-width="1.8"/>
  </g>

  <!-- foreground leaves -->
  <path d="M0 173C12 155 27 143 44 138C41 158 34 178 25 200H0Z" fill="#177744"/>
  <path d="M320 170C307 153 293 143 278 139C281 158 288 178 296 200H320Z" fill="#177744"/>
</svg>