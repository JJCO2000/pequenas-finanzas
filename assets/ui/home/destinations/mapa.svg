<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Mapa Aventura">
  <!-- Block 1 reference lock: approved Mapa/Aventura vector composition. -->
  <defs>
    <linearGradient id="sky" x1="160" y1="0" x2="160" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58C9FF"/>
      <stop offset="1" stop-color="#DDF8FF"/>
    </linearGradient>
    <linearGradient id="volcano" x1="250" y1="32" x2="250" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A6AA4"/>
      <stop offset="1" stop-color="#4C7D8A"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFD65A"/>
      <stop offset="1" stop-color="#FF6B39"/>
    </linearGradient>
    <linearGradient id="dino" x1="100" y1="42" x2="114" y2="183" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7956"/>
      <stop offset=".56" stop-color="#FF5B43"/>
      <stop offset="1" stop-color="#F14336"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF1A8"/>
      <stop offset="1" stop-color="#FFD76A"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B9702F"/>
      <stop offset="1" stop-color="#7E401D"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF0C4"/>
      <stop offset="1" stop-color="#F1CB86"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#073C2E" flood-opacity=".22"/>
    </filter>
    <filter id="tiny" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#3B1C0D" flood-opacity=".24"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="320" height="200" rx="24" fill="url(#sky)"/>
  <g fill="#FFFFFF" opacity=".88">
    <ellipse cx="52" cy="31" rx="30" ry="12"/><ellipse cx="77" cy="28" rx="21" ry="14"/>
    <ellipse cx="150" cy="24" rx="24" ry="11"/><ellipse cx="170" cy="23" rx="18" ry="13"/>
  </g>

  <!-- volcano and far jungle -->
  <path d="M203 107L244 34L286 107Z" fill="url(#volcano)"/>
  <path d="M234 49L244 31L254 48L260 60L250 55L244 67L239 55L229 61Z" fill="url(#lava)"/>
  <path d="M238 41C242 34 247 34 251 41" fill="none" stroke="#FFD65A" stroke-width="4" stroke-linecap="round"/>
  <path d="M0 96C24 82 48 79 71 87C91 70 111 67 132 78C154 64 179 66 199 81C220 72 244 76 261 89C280 82 301 84 320 95V137H0Z" fill="#67B75E"/>
  <path d="M0 112C31 94 61 101 85 106C113 89 141 93 162 107C190 91 217 96 236 109C263 95 292 102 320 112V151H0Z" fill="#329153"/>

  <!-- big tropical leaves left -->
  <g filter="url(#tiny)">
    <path d="M10 118C10 77 15 40 31 10C46 20 54 39 52 61C48 84 33 105 10 118Z" fill="#11783F"/>
    <path d="M18 110C19 75 26 44 40 20" fill="none" stroke="#0A5733" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 103C38 78 57 63 80 56C80 78 68 98 47 112Z" fill="#2CA44E"/>
    <path d="M24 100C44 84 60 72 76 63" fill="none" stroke="#176C3B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- red baby dinosaur -->
  <g filter="url(#soft)">
    <!-- tail -->
    <path d="M83 144C64 159 47 165 28 159C16 155 11 145 15 138C20 131 31 133 42 138C55 144 67 139 79 126Z" fill="url(#dino)"/>

    <!-- body -->
    <ellipse cx="99" cy="139" rx="49" ry="43" fill="url(#dino)"/>
    <ellipse cx="109" cy="142" rx="28" ry="33" fill="url(#belly)"/>

    <!-- neck -->
    <path d="M92 126C85 108 87 85 97 66C106 50 122 42 137 46C152 50 160 65 157 83C154 101 143 119 135 132Z" fill="url(#dino)"/>
    <path d="M112 122C106 107 108 91 115 78C121 66 128 60 136 61C145 63 149 72 146 84C142 101 134 113 129 125Z" fill="url(#belly)"/>

    <!-- head -->
    <path d="M104 57C116 39 142 31 166 35C190 39 208 55 208 72C208 88 192 101 169 103C149 105 129 100 115 91C100 82 96 68 104 57Z" fill="url(#dino)"/>
    <path d="M149 52C168 46 190 49 202 61C211 70 211 79 205 87C198 96 184 100 167 98C155 96 147 90 145 80C144 70 145 60 149 52Z" fill="#FF8461" opacity=".92"/>

    <!-- eye -->
    <ellipse cx="142" cy="57" rx="21" ry="23" fill="#FFFFFF"/>
    <ellipse cx="148" cy="61" rx="12.5" ry="15" fill="#08314A"/>
    <ellipse cx="150" cy="61" rx="8.2" ry="11" fill="#0A91A5" opacity=".7"/>
    <ellipse cx="151" cy="56" rx="5" ry="6" fill="#FFFFFF"/>

    <!-- smile -->
    <path d="M157 83C172 89 190 88 201 82C198 95 185 103 171 101C162 100 157 94 157 83Z" fill="#8E1E29"/>
    <path d="M166 97C174 92 185 93 192 97C185 103 174 104 167 101Z" fill="#F05B70"/>
    <path d="M157 84C173 88 187 88 201 82" fill="none" stroke="#6B1520" stroke-width="2" stroke-linecap="round"/>

    <!-- nostrils -->
    <ellipse cx="191" cy="66" rx="3.3" ry="4.3" fill="#84251F"/>
    <ellipse cx="202" cy="68" rx="3" ry="4" fill="#84251F"/>

    <!-- arms -->
    <path d="M79 119C69 122 65 130 69 137C73 143 82 141 89 136L94 130Z" fill="#F34B3A"/>
    <path d="M129 119C139 120 146 126 145 133C144 140 135 143 127 138L120 132Z" fill="#F34B3A"/>

    <!-- legs -->
    <path d="M72 157C62 163 59 173 63 186H91C95 175 91 163 82 158Z" fill="#E74235"/>
    <path d="M111 158C102 164 100 174 103 186H132C136 175 131 163 121 159Z" fill="#E74235"/>

    <!-- feet/claws -->
    <path d="M66 184L71 176L76 185Z" fill="#FFE9A8"/><path d="M78 185L83 176L88 185Z" fill="#FFE9A8"/>
    <path d="M106 184L111 176L116 185Z" fill="#FFE9A8"/><path d="M119 185L124 176L129 185Z" fill="#FFE9A8"/>

    <!-- spots/highlights -->
    <g fill="#D82E4E">
      <ellipse cx="118" cy="42" rx="9" ry="6"/><ellipse cx="103" cy="57" rx="7" ry="6"/><ellipse cx="97" cy="77" rx="6" ry="5"/>
      <ellipse cx="85" cy="102" rx="8" ry="6"/><ellipse cx="74" cy="126" rx="8" ry="6"/><ellipse cx="62" cy="145" rx="7" ry="5"/>
    </g>
    <ellipse cx="117" cy="54" rx="5" ry="3" fill="#FFA27A" opacity=".9"/>
  </g>

  <!-- wooden adventure map board -->
  <g filter="url(#soft)">
    <path d="M222 80H236V191H222Z" fill="#7F451F"/>
    <path d="M215 83H244V191H215Z" fill="#8E4E23" opacity=".32"/>

    <rect x="181" y="93" width="123" height="76" rx="9" fill="url(#wood)" stroke="#69351B" stroke-width="3"/>
    <rect x="189" y="101" width="107" height="60" rx="6" fill="url(#paper)" stroke="#D39B56" stroke-width="2"/>

    <!-- parchment folds -->
    <path d="M193 108C217 103 246 105 290 111" fill="none" stroke="#F8D99E" stroke-width="2" opacity=".8"/>
    <path d="M202 151C225 155 253 153 285 148" fill="none" stroke="#E4B56C" stroke-width="1.5" opacity=".65"/>

    <!-- map icons -->
    <path d="M204 131L214 116L224 131Z" fill="#92722C"/>
    <path d="M211 131L218 121L226 131Z" fill="#6D8B39"/>
    <g fill="#79A943">
      <circle cx="236" cy="119" r="8"/><circle cx="246" cy="117" r="7"/><circle cx="241" cy="126" r="9"/>
    </g>

    <!-- dashed route -->
    <path d="M213 140C224 138 228 143 233 148C239 154 250 155 258 149C266 143 264 134 271 130" fill="none" stroke="#8C4A1F" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="7 7"/>

    <!-- X -->
    <path d="M272 116L287 131M287 116L272 131" stroke="#B93A1D" stroke-width="6" stroke-linecap="round"/>

    <!-- corner pegs -->
    <g fill="#D79A43" stroke="#8A5426" stroke-width="2">
      <circle cx="188" cy="100" r="5"/><circle cx="297" cy="100" r="5"/><circle cx="188" cy="163" r="5"/><circle cx="297" cy="163" r="5"/>
    </g>

    <!-- vines -->
    <path d="M186 104C181 110 181 119 187 126M299 101C304 109 304 118 298 125M188 160C183 154 181 146 186 140" fill="none" stroke="#3E7E2F" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- dinosaur hand touching map -->
  <path d="M137 126C149 124 164 124 178 129C184 131 186 138 182 142C178 146 172 145 167 142L154 137C148 140 140 139 136 135C133 132 134 128 137 126Z" fill="#F34B3A" filter="url(#tiny)"/>

  <!-- foreground jungle leaves -->
  <path d="M0 180C10 157 27 143 47 137C43 161 34 181 24 200H0Z" fill="#0D6A39"/>
  <path d="M18 200C25 178 40 160 63 151C60 173 50 189 40 200Z" fill="#1D8E43"/>
  <path d="M320 173C303 152 286 143 266 140C272 162 282 182 296 200H320Z" fill="#126F3D"/>
  <path d="M286 200C288 178 297 160 315 147C317 169 315 186 309 200Z" fill="#22984A"/>
</svg>